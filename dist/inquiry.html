<main id="main" class="shell inquiry-page">
  <h1>메일 문의</h1>
  <form class="inquiry-form" action="https://formsubmit.co/hiperscho@gmail.com" method="post" accept-charset="UTF-8">
    <input type="hidden" name="_subject" value="TESFAC website inquiry">
    <input type="hidden" name="_template" value="table">
    <div class="inquiry-fields">
      <div class="inquiry-row">
        <label for="recipient">받는 메일주소</label>
        <input id="recipient" type="email" value="hiperscho@gmail.com" readonly>
      </div>
      <div class="inquiry-row">
        <label for="email">보내는 사람 메일주소</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      </div>
      <div class="inquiry-row">
        <label for="name">업체 또는 성명</label>
        <input id="name" name="name" type="text" maxlength="120" required>
      </div>
      <div class="inquiry-row">
        <label for="phone">연락처</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
      </div>
      <div class="inquiry-row">
        <label for="message">요청내용</label>
        <textarea id="message" name="message" rows="6" maxlength="6000" aria-describedby="message-hint" required></textarea>
        <small id="message-hint">필요한 설비명, 시험 대상, 목표 압력과 세부 사항을 적어 주세요.</small>
      </div>
    </div>
    <p class="inquiry-privacy">입력한 정보는 문의 접수와 회신을 위해 FormSubmit을 통해 전달됩니다. <a href="https://formsubmit.co/privacy.pdf">FormSubmit 개인정보 안내</a></p>
    <button class="button button-primary" type="submit">보내기</button>
  </form>
</main>
<footer class="footer">
  <div class="shell footer-inner">
